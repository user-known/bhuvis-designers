<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Learn about Bhuvi’s Designers, a Coimbatore boutique creating custom designer clothing for women."
    />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://user-known.github.io/bhuvis-designers/our-story.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bhuvi’s Designers" />
    <meta property="og:title" content="Our story | Bhuvi’s Designers" />
    <meta property="og:description" content="Learn about Bhuvi’s Designers, a Coimbatore boutique creating custom designer clothing for women." />
    <meta property="og:url" content="https://user-known.github.io/bhuvis-designers/our-story.html" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply a saved theme and enable reveal animations before first paint.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>Our story | Bhuvi’s Designers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/story.jsx"></script>
  </body>
</html>
